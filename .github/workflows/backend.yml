name: Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      COVERAGE_PCT: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Start Test Database
        working-directory: .
        run: |
          docker compose -f docker-compose.test.yml up -d
          # Give Postgres a few seconds to initialize
          sleep 5

      - name: Run Go Tests with Filtered Coverage
        working-directory: ./backend/internal
        env:
          # Database link for your test_util package 
          DATABASE_URL_TESTS: "postgres://testuser:testpass@localhost:5432/boilerplate_test?sslmode=disable"
          
          # Server Config 
          PORT: 8080
          GIN_MODE: release
          
        run: |
          # Use grep (POSIX); GitHub-hosted runners do not ship ripgrep (rg).
          PKGS=$(go list ./... | grep -vF '/internal/test_util')
          go test -v -coverprofile=coverage.out $PKGS
          PCT=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "COVERAGE_PCT=$PCT" >> $GITHUB_ENV
          echo "The captured coverage is: $PCT"
          echo "### Backend Coverage Summary" >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out >> $GITHUB_STEP_SUMMARY

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/internal/coverage.out
          retention-days: 7

      - name: Update Coverage Badge
        # Only run on main branch so development branches don't overwrite the "official" badge
        if: github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: c21c84f4fba3f91f41a5be25dd59326a
          filename: boilerplate-coverage.json
          label: Backend Coverage
          message: ${{ env.COVERAGE_PCT }}%
          valColorRange: ${{ env.COVERAGE_PCT }}
          maxColorRange: 100
          minColorRange: 0

      - name: Stop Test Database
        if: always()
        working-directory: .
        run: docker compose -f docker-compose.test.yml down