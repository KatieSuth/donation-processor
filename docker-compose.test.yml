services:
  db-test:
    image: postgres:18-alpine
    container_name: donation-processor-db-test
    environment:
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=testpass
      - POSTGRES_DB=donation-processor_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d donation-processor_test"]
      interval: 3s
      timeout: 3s
      retries: 5